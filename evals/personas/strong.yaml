default_answer: En una plataforma de turnos, entrevisté a ocho usuarios y observé cinco sesiones de reserva.
  Detecté que no entendían la disponibilidad, contrasté esa hipótesis con datos de abandono y probé un
  prototipo antes de construir. La tasa de reserva pasó de 30% a 39% en una comparación acotada; no atribuí
