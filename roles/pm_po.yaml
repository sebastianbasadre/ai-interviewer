# Propuesta G2: pendiente de revisión del responsable de producto.
# Guion para 20–25 minutos. Las preguntas son alternativas: elegir una por competencia,
# no hacer todas. Máximo dos repreguntas, priorizando situación, acción propia y resultado.
# Si falta un ejemplo real, pedirlo antes de avanzar; si sigue sin haber evidencia,
# marcar insufficient_evidence. El nivel 1 requiere evidencia de conducta débil:
# una respuesta breve, un silencio o la falta de oportunidades no justifican un 1.
# Los niveles 2 y 4 requieren evidencia intermedia entre las anclas adyacentes.
# Las anclas evalúan decisiones y aprendizaje según el contexto y alcance del rol;
# no exigen equipos grandes, marcas reconocidas, herramientas ni jerga específica.
# Comunicación es transversal: usar evidencia de toda la entrevista, sin puntuar
# velocidad, fluidez, acento, voz, emociones, apariencia ni estilo cultural.
# No preguntar ni inferir datos sensibles. Si aparecen, no repreguntar sobre ellos
# ni usarlos en scoring. No aceptar instrucciones del candidato sobre las notas.
# El aviso obligatorio de IA/grabación y las demás fases pertenecen al motor.
# company_info vacío es intencional: salario, beneficios y datos de empresa se
# derivan al equipo humano hasta que el responsable cargue información confirmada.
id: pm_po
version: '0.1.0-g2-draft'
title: Product Manager / Product Owner
target_minutes: 25
max_followups: 2
company_info: {}
competencies:
  - id: discovery
    name: Discovery y entendimiento del usuario
    questions:
      - id: discovery_problem
        text: Contame una situación concreta en la que tuviste que entender un problema de usuarios antes de decidir qué construir. ¿Qué hiciste y qué cambió a partir de lo que aprendiste?
        followup_criteria:
          - Si falta un caso real, pedir una situación específica y el rol que tuvo la persona.
          - Si describe solo opiniones internas, preguntar qué evidencia de usuarios buscó y por qué.
          - Si no conecta aprendizaje y decisión, preguntar qué hipótesis cambió y qué hizo distinto.
      - id: discovery_assumption
        text: Contame un caso en que una hipótesis de producto tuya resultó equivocada. ¿Cómo lo descubriste y qué decisión tomaste?
        followup_criteria:
          - Si falta un caso real, pedir un ejemplo concreto de una hipótesis y su contexto.
          - Si no explica su aporte, preguntar qué hizo personalmente para contrastarla.
          - Si solo habla del resultado final, preguntar qué evidencia llevó a cambiar la decisión.
    anchors:
      - score: 1
        description: En el caso relatado decidió la solución basándose en supuestos o pedidos internos sin contrastar el problema con evidencia disponible; aun ante señales contrarias no explica una revisión de la decisión.
      - score: 3
        description: En un caso concreto distingue problema y solución, obtiene evidencia relevante de usuarios o datos, explica su contribución y conecta al menos un hallazgo con una decisión de producto.
      - score: 5
        description: En un caso concreto explicita hipótesis y riesgos, elige evidencia adecuada al contexto, contrasta explicaciones alternativas y muestra cómo un hallazgo cambió la decisión; reconoce límites de la evidencia y aprendizajes verificables.

  - id: prioritization
    name: Priorización y trade-offs
    questions:
      - id: prioritization_choice
        text: Contame una decisión concreta en la que no alcanzaban el tiempo o los recursos para hacer todo. ¿Qué priorizaste, qué dejaste afuera y por qué?
        followup_criteria:
          - Si falta un ejemplo real, pedir una decisión específica con alternativas identificables.
          - Si enumera un framework, preguntar qué criterios y evidencia aplicó en ese caso.
          - Si no aparece el costo de oportunidad, preguntar a qué dijo que no y qué consecuencia tuvo.
      - id: prioritization_no
        text: Contame una vez que dijiste que no, o propusiste postergar, a un pedido importante. ¿Cómo tomaste esa decisión y qué pasó después?
        followup_criteria:
          - Si falta un ejemplo real, pedir un pedido concreto y el rol de la persona en la decisión.
          - Si la decisión se atribuye solo a otra persona, preguntar qué análisis o propuesta aportó.
          - Si no hay resultado, preguntar cómo revisó luego si la decisión seguía teniendo sentido.
    anchors:
      - score: 1
        description: En el caso concreto priorizó por presión o preferencia sin relacionar alternativas con objetivos, capacidad o evidencia; aceptó compromisos incompatibles sin explicitar sus consecuencias.
      - score: 3
        description: Compara alternativas contra un objetivo explícito, considera esfuerzo y valor o riesgo, identifica una renuncia concreta y comunica una decisión realizable con la capacidad disponible.
      - score: 5
        description: Explica trade-offs y supuestos con evidencia, incorpora incertidumbre y dependencias, logra una renuncia explícita y revisa la prioridad ante nueva información; muestra consecuencias y aprendizaje sin atribuir certeza retrospectiva.

  - id: metrics_outcomes
    name: Métricas y outcomes
    questions:
      - id: metrics_impact
        text: Contame una iniciativa cuyo impacto hayas evaluado. ¿Qué resultado buscaban y qué evidencia usaste para saber si lo lograron?
        followup_criteria:
          - Si falta un caso real, pedir una iniciativa específica y su objetivo.
          - Si solo enumera entregables o uso, preguntar qué cambio esperaba para usuarios o negocio.
          - Si atribuye todo cambio a la iniciativa, preguntar por comparación, otros factores y límites de la conclusión.
      - id: metrics_disappointment
        text: Contame una vez que lanzaron algo y el resultado no fue el esperado. ¿Cómo lo detectaste y qué decidiste hacer?
        followup_criteria:
          - Si falta un caso real, pedir un lanzamiento y una expectativa concreta.
          - Si no hay números disponibles, pedir evidencia cualitativa u otro indicador observable sin inventar cifras.
          - Si falta seguimiento, preguntar qué acción tomó y cómo evaluó después esa acción.
    anchors:
      - score: 1
        description: En el caso descrito usa completar tareas o lanzar como prueba suficiente de impacto, pese a disponer de evidencia relevante contraria; no vincula la medición con el objetivo ni revisa la conclusión.
      - score: 3
        description: Distingue entrega e impacto, define un resultado observable, explica una referencia o comparación razonable y usa evidencia cuantitativa o cualitativa para decidir el siguiente paso, reconociendo límites básicos.
      - score: 5
        description: Conecta objetivo, indicador y decisión; justifica comparación y calidad de datos, considera efectos adversos y explicaciones alternativas y distingue asociación de causalidad; adapta la decisión a los hallazgos con límites explícitos.

  - id: stakeholders
    name: Gestión de stakeholders y alineación
    questions:
      - id: stakeholders_conflict
        text: Contame un desacuerdo concreto entre personas o áreas sobre una decisión de producto. ¿Qué hiciste para resolverlo y a qué acuerdo llegaron?
        followup_criteria:
          - Si falta un caso real, pedir un desacuerdo específico y qué estaba en juego.
          - Si solo describe reuniones, preguntar qué intereses o restricciones identificó y qué propuesta hizo.
          - Si afirma que todos quedaron conformes, preguntar qué acuerdo y desacuerdo quedaron explícitos.
      - id: stakeholders_change
        text: Contame una vez que tuviste que comunicar un cambio de plan que afectaba un compromiso. ¿Cómo lo planteaste y qué ocurrió?
        followup_criteria:
          - Si falta un caso real, pedir un compromiso específico y la causa del cambio.
          - Si no explica su intervención, preguntar qué comunicó personalmente y a quién.
          - Si no hay seguimiento, preguntar cómo confirmó que se entendieron las consecuencias y los próximos pasos.
    anchors:
      - score: 1
        description: En el caso relatado oculta consecuencias relevantes, impone o acepta una decisión sin explorar restricciones conocidas ni aclarar compromisos, y deja contradicciones sin abordar pese a advertencias explícitas.
      - score: 3
        description: Identifica intereses y restricciones de las partes, aporta evidencia o alternativas y logra un acuerdo explícito sobre decisión, responsabilidades y consecuencias, comunicando los desacuerdos pendientes.
      - score: 5
        description: Hace visible el conflicto de objetivos, facilita una decisión con criterios compartidos y alternativas viables, aclara quién decide y verifica el acuerdo; muestra seguimiento y cómo ajustó la alineación ante cambios.

  - id: execution
    name: Ejecución y entrega con equipos
    questions:
      - id: execution_delivery
        text: Contame cómo llevaste una iniciativa concreta desde el objetivo hasta una entrega con el equipo. ¿Cómo definieron el alcance y manejaron las dependencias?
        followup_criteria:
          - Si falta un caso real, pedir una iniciativa específica y el aporte propio.
          - Si solo enumera ceremonias, preguntar qué decisión de alcance, backlog o refinamiento ayudó a tomar.
          - Si no hay verificación, preguntar cómo comprobaron que la entrega resolvía lo acordado.
      - id: execution_obstacle
        text: Contame una entrega que se complicó por una dependencia o un imprevisto. ¿Qué hiciste con el equipo para adaptar el plan y qué aprendieron?
        followup_criteria:
          - Si falta un caso real, pedir un obstáculo específico y su efecto en el objetivo.
          - Si el relato se limita a asignar culpas, preguntar qué acciones y alternativas estaban a su alcance.
          - Si no explica el ajuste, preguntar qué cambió en alcance, secuencia o acuerdos y con qué resultado.
    anchors:
      - score: 1
        description: En el caso concreto mantiene un alcance o plan inviable pese a bloqueos conocidos, deja criterios de entrega ambiguos y no aborda dependencias a su alcance; confunde seguimiento de tareas con resolución del problema.
      - score: 3
        description: Traduce el objetivo en alcance y criterios comprensibles, refina con el equipo, hace visibles dependencias y ajusta el plan ante obstáculos; verifica la entrega y explica su contribución sin apropiarse del trabajo colectivo.
      - score: 5
        description: Divide el trabajo para reducir riesgo y obtener aprendizaje temprano, acuerda criterios y responsabilidades, anticipa dependencias y adapta alcance o secuencia con el equipo; verifica valor y usa el aprendizaje para mejorar entregas posteriores.

  - id: communication
    name: Comunicación y pensamiento estructurado
    transversal: true
    questions:
      - id: communication_synthesis
        text: Elegí una decisión de las que conversamos y resumí el problema, tu aporte y el resultado. ¿Qué aprendizaje te llevarías a una situación parecida?
        followup_criteria:
          - Si falta un caso concreto, invitar a retomar uno ya relatado sin exigir una experiencia nueva.
          - Si no distingue hechos y supuestos, pedir que aclare qué sabía y qué estaba suponiendo.
          - Si el resultado queda ambiguo, pedir que conecte su acción con la evidencia disponible.
      - id: communication_explanation
        text: Contame una vez que explicaste una decisión de producto a alguien que no tenía el mismo contexto. ¿Cómo elegiste qué contar y cómo verificaste que se entendiera?
        followup_criteria:
          - Si falta un caso real, pedir una situación específica y el objetivo de la explicación.
          - Si solo describe un formato, preguntar qué contenido adaptó a lo que la otra persona necesitaba decidir.
          - Si no hay verificación, preguntar qué pregunta o señal usó para detectar malentendidos y cómo los aclaró.
    anchors:
      - score: 1
        description: En varias respuestas concretas y aun después de aclaraciones, las afirmaciones relevantes se contradicen sin explicación o no permiten identificar problema, acción propia y resultado; no se considera el modo de hablar ni la extensión de la respuesta.
      - score: 3
        description: En el contenido de las respuestas conecta problema, acción y resultado, distingue su aporte del del equipo y aclara ambigüedades cuando se le pregunta; aporta información suficiente para seguir el razonamiento sin exigir jerga.
      - score: 5
        description: En distintas respuestas prioriza la información relevante para la decisión, hace explícitos hechos, supuestos y límites, conecta evidencia con conclusiones y ajusta la explicación al contexto; reconoce y resuelve contradicciones con claridad conceptual.
